- type: entity
  name: Random Folder Spawner
  id: FolderSpawner
  parent: MarkerBase
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: _Omu/Objects/Misc/folders.rsi # Omu
    layers:
    #- state: folder-base # Omu
    - state: folder-colormap
  - type: RandomSpawner
    offset: 0
    prototypes:
    - BoxFolderBase
    - BoxFolderRed
    - BoxFolderBlue
    - BoxFolderYellow
    - BoxFolderGrey
    - BoxFolderBlack
    - BoxFolderGreen
